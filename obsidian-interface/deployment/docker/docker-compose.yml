# Obsidian Interface — front this at a CDN, a reverse proxy or nothing at all.
#
#   docker compose -f obsidian-interface/deployment/docker/docker-compose.yml up -d
#
# Point it at nodes you run (or that you trust to be honest) — the interface is a
# reader, and if every node it is configured with is down it says so instead of
# inventing chain data.
name: obsidian-interface

services:
  interface:
    build:
      # Context is the repository root: the browser bundle is compiled from the
      # same core modules the node runs.
      # Repository root: the Dockerfile builds obsidian-core first.
      context: ../../..
      dockerfile: obsidian-interface/deployment/docker/Dockerfile
    image: obsidian/interface:1.7.0
    restart: unless-stopped
    environment:
      # Which network this interface serves. Required, no default: it decides
      # which nodes are accepted, so a devnet page cannot show mainnet data.
      OBSIDIAN_INTERFACE_NETWORK: ${OBSIDIAN_INTERFACE_NETWORK:?set OBSIDIAN_INTERFACE_NETWORK to devnet, testnet, staging or mainnet - there is no default}
      OBSIDIAN_NODE_URLS: ${OBSIDIAN_NODE_URLS:-http://host.docker.internal:8630}
      OBSIDIAN_INTERFACE_TRUST_PROXY: ${OBSIDIAN_INTERFACE_TRUST_PROXY:-true}
      OBSIDIAN_INTERFACE_LOG_LEVEL: ${OBSIDIAN_INTERFACE_LOG_LEVEL:-info}
      # The Genesis Invitation, without which a fresh interface serves nine
      # sites and refuses every registration with
      # ERR_GENESIS_INVITE_NOT_CONFIGURED — the deployment looks healthy and can
      # never be claimed. Mint one on the host that will hold the data volume:
      #   node --input-type=module -e "const {newGenesisInvitation}=await import('./obsidian-interface/dist/server/genesis-invite.js');const {code,hash}=newGenesisInvitation();console.log('CODE '+code);console.log('HASH '+hash)"
      # Then start with single quotes around the hash — the scrypt string
      # contains `$`, which the shell would otherwise expand:
      #   OBSIDIAN_GENESIS_INVITE_HASH='scrypt$...' docker compose up -d
      OBSIDIAN_GENESIS_INVITE_HASH: ${OBSIDIAN_GENESIS_INVITE_HASH:-}
      # Mining gate (protocol 1.7.0). The platform signs a short-lived certificate for every claim and the node
      # refuses a claim without one. Generate the pair with `node scripts/generate-mining-gate-key.mjs`, put the
      # encrypted keystore in the interface-data volume and pass the passphrase (12+ characters) here. Without
      # them nobody can mine. The matching PUBLIC key must be on every node (OBSIDIAN_MINING_GATE_PUBLIC_KEYS).
      OBSIDIAN_GATE_KEYSTORE: ${OBSIDIAN_GATE_KEYSTORE:-}
      OBSIDIAN_GATE_KEYSTORE_PASSPHRASE: ${OBSIDIAN_GATE_KEYSTORE_PASSPHRASE:-}
      # Where the interface keeps accounts, sessions and the redeemed invite.
      # It is a docker volume here, so the pass-through is explicit.
      OBSIDIAN_INTERFACE_DATA_DIR: ${OBSIDIAN_INTERFACE_DATA_DIR:-/data}
    ports:
      - "${OBSIDIAN_INTERFACE_BIND:-127.0.0.1}:8788:8788"
    volumes:
      - interface-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  interface-data:
