# Obsidian Interface behind nginx (TLS terminates here, the interface stays on
# loopback). Deploy as /etc/nginx/sites-available/obsidian-interface.
#
# Nothing in this file can create or move OBS: it forwards HTTP. If nginx is
# down, the chain keeps running — only this window onto it closes.
#
# The interface must be started with OBSIDIAN_INTERFACE_TRUST_PROXY=true when it
# sits behind this file: it then rate-limits by the address nginx appended to
# X-Forwarded-For and marks the session cookie Secure. Without it every visitor
# looks like 127.0.0.1 and shares one budget.
#
# Add these two lines to the http {} block (nginx.conf) first:
#
#   limit_req_zone $binary_remote_addr zone=obsidian_auth:10m rate=30r/m;
#   limit_req_zone $binary_remote_addr zone=obsidian_api:10m  rate=600r/m;
#
# If Cloudflare (or any CDN / the worker in cloudflare/) sits in FRONT of nginx,
# every request arrives from the CDN, so tell nginx whose word to take for the
# visitor's address — and ONLY theirs. Without this, rate limits are per CDN
# edge, not per visitor. See docs/ORACLE-VPS-DEPLOYMENT.md ("Behind Cloudflare").
#
#   set_real_ip_from <each Cloudflare range from https://www.cloudflare.com/ips/>;
#   real_ip_header   X-Forwarded-For;      # the worker writes the visitor here
#   real_ip_recursive on;

upstream obsidian_interface {
    server 127.0.0.1:8788;     # mainnet. testnet 18788, staging 28788, devnet 38788.
    keepalive 16;
}

# Redirect every plaintext request to TLS before any content is served.
server {
    listen 80;
    listen [::]:80;
    server_name obsidian.example;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen … ssl http2` works on every nginx there is, including the 1.18 and 1.24 that
    # Ubuntu 22.04 and 24.04 ship. nginx 1.25.1+ prefers a separate `http2 on;` line and
    # prints a deprecation notice for this form; the notice is harmless, whereas `http2 on;`
    # on an older nginx is a startup error ("unknown directive").
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name obsidian.example;

    ssl_certificate     /etc/letsencrypt/live/obsidian.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/obsidian.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # The interface sets its own CSP and caching; nginx must not silently replace
    # or duplicate either. (It used to add `expires 5m` to /js/ and /css/, which
    # fought the interface's content-hashed `immutable` caching and could leave a
    # stale bundle in a browser for five minutes after an upgrade.)
    proxy_hide_header X-Powered-By;
    client_max_body_size 512k;      # the interface accepts 256 KiB bodies

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # $proxy_add_x_forwarded_for APPENDS the address nginx saw: the last entry is
    # the one the interface trusts; anything before it is client-supplied.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # Sign-in, registration, recovery, MFA, invites: the routes that cost real CPU
    # (password hashing is slow on purpose) and are worth guessing at.
    location /api/auth/ {
        limit_req zone=obsidian_auth burst=10 nodelay;
        limit_req_status 429;
        limit_except GET POST OPTIONS { deny all; }
        proxy_pass http://obsidian_interface;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=obsidian_api burst=100 nodelay;
        limit_req_status 429;
        limit_except GET POST OPTIONS { deny all; }
        proxy_pass http://obsidian_interface;
        proxy_read_timeout 20s;
    }

    location / {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://obsidian_interface;
    }
}
