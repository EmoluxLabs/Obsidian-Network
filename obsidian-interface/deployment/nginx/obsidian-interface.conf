# Obsidian Interface behind nginx (TLS terminates here, the interface stays on
# loopback). Deploy as /etc/nginx/sites-available/obsidian-interface.
#
# Nothing in this file can create or move OBS: it forwards HTTP. If nginx is
# down, the chain keeps running — only this window onto it closes.

upstream obsidian_interface {
    server 127.0.0.1:8788;
    keepalive 16;
}

# Redirect every plaintext request to TLS before any content is served.
server {
    listen 80;
    listen [::]:80;
    server_name obsidian.example;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name obsidian.example;

    ssl_certificate     /etc/letsencrypt/live/obsidian.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/obsidian.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The interface sets its own CSP; nginx must not silently replace it.
    proxy_hide_header X-Powered-By;
    client_max_body_size 512k;      # the interface accepts 256 KiB signed txs

    # Long-lived static assets, revalidated documents.
    location ~* ^/(js|css|assets)/ {
        proxy_pass http://obsidian_interface;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # Reads can be held briefly; a stale cache is still a cache of chain data,
    # never a substitute for it.
    location /api/ {
        proxy_pass http://obsidian_interface;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        limit_except GET POST OPTIONS { deny all; }
    }

    location / {
        proxy_pass http://obsidian_interface;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
