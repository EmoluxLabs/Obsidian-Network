<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Obsidian Network — OBS coin">
  <title>Obsidian Network</title>
  <desc>The official OBS coin: a black minted disc with a brushed-silver rim, a ring of stars, a circuit-trace inner ring, and a silver slashed O at the centre.</desc>
  <defs>
    <!-- Brushed metal: the rim catches light top-left and falls into shadow bottom-right. -->
    <linearGradient id="obs-rim" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#e8ecf1"/>
      <stop offset="0.38" stop-color="#9aa3ad"/>
      <stop offset="0.52" stop-color="#f2f5f8"/>
      <stop offset="0.72" stop-color="#7d868f"/>
      <stop offset="0.88" stop-color="#d7dce2"/>
      <stop offset="1" stop-color="#5c646c"/>
    </linearGradient>
    <linearGradient id="obs-rim-inner" x1="0.9" y1="0.05" x2="0.1" y2="0.95">
      <stop offset="0" stop-color="#cbd2d9"/>
      <stop offset="0.45" stop-color="#6f777f"/>
      <stop offset="0.7" stop-color="#e2e7ec"/>
      <stop offset="1" stop-color="#4a5158"/>
    </linearGradient>
    <!-- The coin face: near-black obsidian with a faint sheen. -->
    <radialGradient id="obs-face" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#24282d"/>
      <stop offset="0.45" stop-color="#121417"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <radialGradient id="obs-core" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#1b1e22"/>
      <stop offset="1" stop-color="#030304"/>
    </radialGradient>
    <!-- The O and the blade share one silver so they read as a single struck mark. -->
    <linearGradient id="obs-silver" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#dfe4ea"/>
      <stop offset="0.55" stop-color="#8e979f"/>
      <stop offset="0.78" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#6b737a"/>
    </linearGradient>
    <linearGradient id="obs-blade" x1="0.85" y1="0.1" x2="0.2" y2="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#e9edf1"/>
      <stop offset="0.6" stop-color="#aab2ba"/>
      <stop offset="1" stop-color="#f4f7fa"/>
    </linearGradient>

    <!-- One star, reused around the ring. -->
    <symbol id="obs-star" viewBox="-10 -10 20 20">
      <path fill="#eef1f5"
            d="M0-10 2.25-3.1 9.5-3.1 3.6 1.2 5.9 8.1 0 3.8-5.9 8.1-3.6 1.2-9.5-3.1-2.25-3.1Z"/>
    </symbol>

    <!-- The struck mark: a bold O cut by a diagonal blade. -->
    <mask id="obs-o-cut">
      <rect x="0" y="0" width="512" height="512" fill="#000"/>
      <circle cx="256" cy="256" r="88" fill="#fff"/>
      <circle cx="256" cy="256" r="52" fill="#000"/>
      <!-- The blade's corridor removes the O where the blade crosses it. -->
      <path d="M337.0 93.6 125.0 381.6 175.0 418.4 387.0 130.4Z" fill="#000"/>
    </mask>
  </defs>

  <!-- Coin body -->
  <circle cx="256" cy="256" r="246" fill="url(#obs-rim)"/>
  <circle cx="256" cy="256" r="232" fill="#0a0b0d"/>
  <circle cx="256" cy="256" r="226" fill="url(#obs-rim-inner)"/>
  <circle cx="256" cy="256" r="218" fill="url(#obs-face)"/>

  <!-- Star ring -->
  <g>
    <use href="#obs-star" x="246" y="18" width="20" height="20"/>
    <use href="#obs-star" x="303" y="26" width="20" height="20"/>
    <use href="#obs-star" x="355" y="50" width="20" height="20"/>
    <use href="#obs-star" x="398" y="88" width="20" height="20"/>
    <use href="#obs-star" x="429" y="139" width="20" height="20"/>
    <use href="#obs-star" x="444" y="196" width="20" height="20"/>
    <use href="#obs-star" x="444" y="296" width="20" height="20"/>
    <use href="#obs-star" x="429" y="353" width="20" height="20"/>
    <use href="#obs-star" x="398" y="404" width="20" height="20"/>
    <use href="#obs-star" x="355" y="442" width="20" height="20"/>
    <use href="#obs-star" x="303" y="466" width="20" height="20"/>
    <use href="#obs-star" x="246" y="474" width="20" height="20"/>
    <use href="#obs-star" x="189" y="466" width="20" height="20"/>
    <use href="#obs-star" x="137" y="442" width="20" height="20"/>
    <use href="#obs-star" x="94" y="404" width="20" height="20"/>
    <use href="#obs-star" x="63" y="353" width="20" height="20"/>
    <use href="#obs-star" x="48" y="296" width="20" height="20"/>
    <use href="#obs-star" x="48" y="196" width="20" height="20"/>
    <use href="#obs-star" x="63" y="139" width="20" height="20"/>
    <use href="#obs-star" x="94" y="88" width="20" height="20"/>
    <use href="#obs-star" x="137" y="50" width="20" height="20"/>
    <use href="#obs-star" x="189" y="26" width="20" height="20"/>
  </g>

  <!-- Inner minted ring holding the circuitry -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="url(#obs-rim-inner)" stroke-width="7"/>
  <circle cx="256" cy="256" r="172" fill="#0b0c0e"/>
  <circle cx="256" cy="256" r="126" fill="none" stroke="#5f666d" stroke-width="3" opacity="0.85"/>

  <!-- Circuit traces: the network under the coin's face. -->
  <g fill="none" stroke="#c9d0d7" stroke-width="3.2" stroke-linecap="round" opacity="0.9">
    <path d="M150 154 150 128 206 128 206 108"/>
    <path d="M222 116 274 116 274 98"/>
    <path d="M292 108 292 130 340 130 340 152"/>
    <path d="M362 176 386 176 386 216"/>
    <path d="M398 232 398 280 380 280"/>
    <path d="M386 300 386 336 360 336 360 358"/>
    <path d="M338 372 300 372 300 396"/>
    <path d="M282 404 232 404 232 396"/>
    <path d="M206 398 172 398 172 360"/>
    <path d="M150 344 126 344 126 300"/>
    <path d="M114 282 114 234 134 234"/>
    <path d="M124 214 124 178 150 178"/>
    <path d="M168 196 196 196"/>
    <path d="M318 196 344 196"/>
    <path d="M168 318 196 318"/>
    <path d="M318 318 344 318"/>
  </g>
  <g fill="#e6eaef" opacity="0.95">
    <circle cx="206" cy="106" r="5"/>
    <circle cx="274" cy="96" r="5"/>
    <circle cx="398" cy="232" r="5"/>
    <circle cx="300" cy="398" r="5"/>
    <circle cx="126" cy="300" r="5"/>
    <circle cx="124" cy="176" r="5"/>
    <circle cx="386" cy="338" r="5"/>
    <circle cx="172" cy="358" r="5"/>
  </g>
  <g fill="#aab2ba" opacity="0.8">
    <rect x="130" y="240" width="16" height="8" rx="2"/>
    <rect x="366" y="240" width="16" height="8" rx="2"/>
    <rect x="240" y="126" width="8" height="16" rx="2"/>
    <rect x="264" y="370" width="8" height="16" rx="2"/>
  </g>

  <!-- Central disc -->
  <circle cx="256" cy="256" r="118" fill="url(#obs-core)"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#3a4046" stroke-width="2"/>

  <!-- The struck O, cut where the blade crosses it -->
  <circle cx="256" cy="256" r="88" fill="url(#obs-silver)" mask="url(#obs-o-cut)"/>

  <!-- The blade: a sharp diagonal slash through the O -->
  <path d="M362.0 112.0 239.1 243.6 150.0 400.0 272.9 268.4Z" fill="url(#obs-blade)"/>
  <path d="M362.0 112.0 239.1 243.6 256.0 256.0Z" fill="#ffffff" opacity="0.5"/>
  <path d="M150.0 400.0 272.9 268.4 256.0 256.0Z" fill="#7e868e" opacity="0.4"/>
</svg>
