<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Obsidian Wallet</title>
<style>
:root{--bg:#F6F7F9;--ob:#0B0D10;--tx:#111318;--mu:#68707C;--go:#C8A85A;--gd:#7A6126;--bd:#E4E7EB;--ok:#1F7A55;--er:#A12626}
*{box-sizing:border-box}body{margin:0;background:#E9EBEF;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx)}
#app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);padding:0 20px 40px}
h1{font-size:28px;line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:800}
.lb{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--gd);margin:22px 0 10px}
.card{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:6px 16px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:16px;border:1.5px solid #D5D9DF;background:#fff;color:var(--ob);font-weight:800;font-size:15px;letter-spacing:.12em;cursor:pointer;margin-top:12px}
.btn.p{background:var(--ob);border-color:var(--ob);color:#fff;box-shadow:0 10px 22px rgba(11,13,16,.22)}.btn:disabled{opacity:.5;cursor:default}.btn.s{height:44px;font-size:12.5px;margin-top:0}
input,textarea{width:100%;border:1.5px solid #D5D9DF;border-radius:14px;padding:0 16px;font-size:16px;background:#fff;color:var(--tx);font-family:inherit}input{height:56px}textarea{padding:14px 16px;height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
input:focus,textarea:focus{outline:none;border-color:var(--go);box-shadow:0 0 0 4px rgba(200,168,90,.18)}
label{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--mu);margin:16px 0 8px 2px}
.err{color:var(--er);font-size:13px;font-weight:600;margin-top:10px;min-height:18px}.ok{color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-top:1px solid #EEF0F3;font-size:14px}.row:first-child{border-top:0}.row span{color:var(--mu);font-size:11px;font-weight:800;letter-spacing:.14em}
.m{font-family:ui-monospace,Menlo,Consolas,monospace}.mu{color:var(--mu)}.hd{display:flex;align-items:center;justify-content:space-between;height:68px}
.pill{font-size:10px;font-weight:800;letter-spacing:.1em;padding:4px 9px;border-radius:99px;background:#EAF6F0;color:var(--ok)}.pill.w{background:#FFF4DC;color:#8A5A00}
.wr{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid #F0DDA8;background:#FFF4DC;color:#6B4A00;font-size:13px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.back{cursor:pointer;font-size:13px;font-weight:800;letter-spacing:.1em}
#scan{position:fixed;inset:0;background:rgba(11,13,16,.92);z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;color:#fff}
#scan video{width:min(88vw,380px);aspect-ratio:1;object-fit:cover;border-radius:24px;border:3px solid var(--go);background:#000}
</style></head><body><div id="app"></div><div id="scan"><b style="letter-spacing:.16em">SCAN WALLET QR</b><video id="vid" playsinline muted></video><div class="mu" id="sm">Point the camera at an Obsidian address QR code.</div><button class="btn" style="max-width:300px" data-a="stopScan">CANCEL</button></div>
