# app.obsmainnet.us.ci  ->  upstream obsidian_app (see conf.d/obsidian-web.conf)
#
# Its OWN server_name, its OWN certificate, its OWN upstream. It does not depend on the default site and shares no
# upstream with the other two vhosts, so this hostname can only ever reach the Web App.
#
# Certificate (once, before enabling the 443 block):
#   sudo certbot certonly --webroot -w /var/www/html -d app.obsmainnet.us.ci
# The port-80 block below answers the ACME challenge, so it works before the certificate exists; nginx -t will
# fail on the 443 block until the files named there exist, which is why docs/web-separation.md issues certificates
# first.

server {
    listen 80;
    listen [::]:80;
    server_name app.obsmainnet.us.ci;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.obsmainnet.us.ci;

    ssl_certificate     /etc/letsencrypt/live/app.obsmainnet.us.ci/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.obsmainnet.us.ci/privkey.pem;
    include snippets/obsidian-tls.conf;

    include snippets/obsidian-proxy.conf;
    client_max_body_size 512k;

    # Sign-in, registration, recovery, MFA, invites.
    location /api/auth/ {
        limit_req zone=obsidian_auth burst=10 nodelay;
        limit_req_status 429;
        limit_except GET POST OPTIONS { deny all; }
        proxy_pass http://obsidian_app;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=obsidian_api burst=100 nodelay;
        limit_req_status 429;
        limit_except GET POST OPTIONS { deny all; }
        proxy_pass http://obsidian_app;
        proxy_read_timeout 20s;
    }

    location / {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://obsidian_app;
    }
}
