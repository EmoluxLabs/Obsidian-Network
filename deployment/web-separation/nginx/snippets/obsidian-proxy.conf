# Shared by the three vhosts. Nothing site-specific lives here (no upstream, no hostname).
#
# No WebSocket headers: none of the three services uses a WebSocket or an Upgrade (they speak plain HTTP request/
# response), so `Connection ""` is correct and keeps upstream connections alive.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# $proxy_add_x_forwarded_for APPENDS the address nginx saw: the last entry is the one the services trust.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_hide_header X-Powered-By;
