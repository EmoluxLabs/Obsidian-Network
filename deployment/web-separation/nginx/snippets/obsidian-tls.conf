ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:obsidian_tls:10m;
ssl_session_tickets off;
# HSTS on a host that has working HTTPS. Without includeSubDomains here: each vhost answers for itself, and this
# header must not commit a sibling subdomain that is not ready.
add_header Strict-Transport-Security "max-age=63072000" always;
