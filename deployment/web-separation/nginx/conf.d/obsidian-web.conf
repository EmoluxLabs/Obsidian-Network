# Included in the http {} context (Debian/Ubuntu nginx.conf includes /etc/nginx/conf.d/*.conf there).
#
# ONE place that names the three internal listeners. A vhost never writes a port of its own: it names an
# upstream, so "which site is on which port" is answered here and nowhere else. scripts/install.sh rewrites
# these three `server` lines from the port in each service's env file when a port had to be replaced.
#
#   obsidian_platform   obsmainnet.us.ci          main platform (landing, Mine OBS, account, explorer, ...)
#   obsidian_app        app.obsmainnet.us.ci      Web App (obsidian-app-web)
#   obsidian_wallet     wallet.obsmainnet.us.ci   Wallet web app (obsidian-wallet-web)
#
# Every upstream is loopback. Nothing here, and nothing in a vhost, publishes 8789/8790/8791.

upstream obsidian_platform { server 127.0.0.1:8789; keepalive 16; }
upstream obsidian_app      { server 127.0.0.1:8790; keepalive 16; }
upstream obsidian_wallet   { server 127.0.0.1:8791; keepalive 16; }

# Per-visitor budgets for the routes that cost CPU (password hashing) or are worth guessing at.
limit_req_zone $binary_remote_addr zone=obsidian_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=obsidian_api:10m  rate=600r/m;

# If Cloudflare or another CDN sits in FRONT of nginx, every request arrives from the CDN: tell nginx whose word to
# take for the visitor address, and ONLY theirs, or the budgets above become per-edge instead of per-visitor.
#   set_real_ip_from <each range from https://www.cloudflare.com/ips/>;
#   real_ip_header   X-Forwarded-For;
#   real_ip_recursive on;
