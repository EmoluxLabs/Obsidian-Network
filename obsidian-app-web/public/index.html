<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Obsidian Network</title>
<style>
:root{--bg:#F6F7F9;--ob:#0B0D10;--tx:#111318;--mu:#68707C;--go:#C8A85A;--gd:#7A6126;--bd:#E4E7EB;--ok:#1F7A55;--er:#A12626}
*{box-sizing:border-box}body{margin:0;background:#E9EBEF;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx)}
#app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);padding:0 20px 100px;position:relative}
h1{font-size:30px;line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:800}
.lb{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--gd);margin:22px 0 10px}
.card{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:6px 16px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:16px;border:1.5px solid #D5D9DF;background:#fff;color:var(--ob);font-weight:800;font-size:15px;letter-spacing:.12em;cursor:pointer;margin-top:12px}
.btn.p{background:var(--ob);border-color:var(--ob);color:#fff;box-shadow:0 10px 22px rgba(11,13,16,.22)}
.btn:disabled{opacity:1;cursor:default}
input{width:100%;height:56px;border:1.5px solid #D5D9DF;border-radius:14px;padding:0 16px;font-size:16px;background:#fff;color:var(--tx)}
input:focus{outline:none;border-color:var(--go);box-shadow:0 0 0 4px rgba(200,168,90,.18)}
label{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--mu);margin:16px 0 8px 2px}
.err{color:var(--er);font-size:13px;font-weight:600;margin-top:10px;min-height:18px}.ok{color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-top:1px solid #EEF0F3;font-size:14px}.row:first-child{border-top:0}.row span{color:var(--mu);font-size:11px;font-weight:800;letter-spacing:.14em}
.m{font-family:ui-monospace,Menlo,Consolas,monospace}.mu{color:var(--mu)}
.hd{display:flex;align-items:center;justify-content:space-between;height:68px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:72px;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:space-around;align-items:center}
.nav a{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--mu);cursor:pointer;padding:10px 8px}.nav a.on{color:var(--ob)}.nav a.on::before{content:"";display:block;width:18px;height:3px;background:var(--go);border-radius:2px;margin:0 auto 6px}
.pill{font-size:10px;font-weight:800;letter-spacing:.1em;padding:4px 9px;border-radius:99px;background:#EAF6F0;color:var(--ok)}
.big{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--bd);border-radius:18px;padding:20px 16px;margin-top:10px;font-weight:800;letter-spacing:.12em;cursor:pointer}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes fd{from{opacity:0;transform:translateY(8px)}}
</style></head><body><div id="app"></div><script>

home:()=>hdr('OBSIDIAN NETWORK')+`<h1 style="font-size:24px">Welcome back.</h1><div class="card" style="margin-top:16px;padding:20px"><div class="lb" style="margin:0;color:var(--mu)">OBS BALANCE</div><div class="m" style="font-size:34px;font-weight:600;margin-top:6px">${f5(S.bal)}</div></div><div class="card" style="margin-top:10px"><div class="row"><span>MINING STATUS</span><b class="${S.mine?'ok':'mu'}">${S.mine?'Active':'Idle'}</b></div><div class="row"><span>NETWORK STATUS</span><b class="ok">Operational</b></div></div>${[['mine','MINING'],['wallet','WALLET'],['explorer','EXPLORER']].map(([k,t])=>`<div class="big" onclick="go('${k}')">${t}<span>›</span></div>`).join('')}<div class="lb">RECENT ACTIVITY</div>${txs(3)}${nav('home')}`,
mine:()=>{const on=!!S.mine,dn=on&&el()>=SESS;return hdr('MINING')+`<div style="text-align:center"><div class="lb" style="margin:4px 0;color:var(--mu)">OBS BALANCE</div><div class="m" style="font-size:34px;font-weight:600">${f5(S.bal)}</div></div><div style="position:relative;width:250px;height:250px;margin:14px auto"><svg width="250" height="250" viewBox="0 0 250 250" fill="none" style="position:absolute"><circle cx="125" cy="125" r="108" stroke="#E4E7EB" stroke-width="6"/><circle id="arc" cx="125" cy="125" r="108" stroke="#C8A85A" stroke-width="6" stroke-linecap="round" stroke-dasharray="6 679" transform="rotate(-90 125 125)"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">${logo(on?84:130)}<div style="font-size:11px;font-weight:800;letter-spacing:.2em;margin-top:10px;color:${on?'var(--ok)':'var(--mu)'}">${dn?'READY TO CLAIM':on?'MINING ACTIVE':'READY'}</div>${on?'<div id="tm" class="m" style="font-size:26px;font-weight:600">'+tm(SESS-el())+'</div><div style="font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--mu)">NEXT CLAIM</div>':''}</div></div>${dn?'<button id="cl" class="btn p" onclick="claim()">CLAIM '+f5(RATE*4)+' OBS</button>':on?'<button class="btn p" disabled>● MINING ACTIVE</button>':'<button class="btn p" onclick="startM()">START MINING</button>'}<div class="card" style="margin-top:16px"><div class="row"><span>MINING RATE</span><b class="m">${RATE} OBS/h</b></div><div class="row"><span>CLAIM CYCLE</span><b>Every 4 hours</b></div><div class="row"><span>SESSION EARNED</span><b class="m" id="ea">${f5(on?el()/3600*RATE:0)}</b></div><div class="row"><span>BLOCK HEIGHT</span><b class="m">#${ht().toLocaleString()}</b></div></div>`+nav('mine')},
wallet:()=>hdr('WALLET')+`<div class="card" style="padding:20px"><div class="lb" style="margin:0;color:var(--mu)">OBS BALANCE</div><div class="m" style="font-size:34px;font-weight:600;margin:6px 0 14px">${f5(S.bal)}</div><div class="m" style="font-size:12.5px;word-break:break-all">${addr()}</div>${S.names[0]?`<div class="pill" style="display:inline-block;margin-top:10px;background:#FBF6E8;color:var(--gd)">${S.names[0]}</div>`:''}</div><div style="display:flex;gap:12px"><button class="btn ${wt=='send'?'p':''}" onclick="wt='send';res='';render()">SEND</button><button class="btn ${wt=='receive'?'p':''}" onclick="wt='receive';res='';render()">RECEIVE</button></div>${wt=='send'?`${fld('to','RECIPIENT','text','obs1… or name.obs')}${fld('am','AMOUNT (OBS)','number','0.00000')}<div class="mu" style="font-size:12.5px;margin-top:8px">Available ${f5(S.bal)} OBS · Fee ${FEE} OBS</div><div class="err">${err}</div><button class="btn p" style="margin-top:4px" onclick="send()">REVIEW TRANSACTION</button>`:`<div class="card" style="margin-top:14px;padding:18px;text-align:center"><div class="lb" style="margin:0 0 10px">YOUR OBSIDIAN ADDRESS</div><div class="m" style="word-break:break-all;font-size:13px">${addr()}</div></div><button class="btn p" onclick="navigator.clipboard&&navigator.clipboard.writeText('${addr()}');res='Copied';render()">COPY ADDRESS</button><div class="ok" style="text-align:center;margin-top:8px">${res}</div>`}<div class="lb">RECENT TRANSACTIONS</div>${txs(5)}${nav('wallet')}`,
explorer:()=>hdr('EXPLORER')+`<input id="q" placeholder="Search blocks, transactions, addresses..."><button class="btn p" style="margin-top:10px" onclick="res=v('q');render()">SEARCH</button>${res?`<div class="card" style="margin-top:12px;padding:14px" class="mu">${/^\d+$/.test(res)?`Block #${(+res).toLocaleString()} · <span class="m">${hx(+res)}</span>`:'No match in this demo.'}</div>`:''}<div class="card" style="margin-top:14px"><div class="row"><span>BLOCK HEIGHT</span><b class="m">#${ht().toLocaleString()}</b></div><div class="row"><span>CONSENSUS</span><b>Proof of Time</b></div><div class="row"><span>NETWORK</span><b>Obsidian Mainnet</b></div></div><div class="lb">LATEST BLOCKS</div><div class="card">${[0,1,2].map(i=>`<div class="row"><div><b class="m">#${(ht()-i).toLocaleString()}</b><div class="m mu" style="font-size:12px;margin-top:3px">${hx(ht()-i)}</div></div><span class="pill">${i?'FINAL':'PENDING'}</span></div>`).join('')}</div><div class="lb">LATEST TRANSACTIONS</div><div class="card">${[0,1,2].map(i=>`<div class="row"><div><b class="m">${hx(900+i)}</b><div class="mu" style="font-size:12px;margin-top:3px">${[2.5,10,0.75][i]} OBS</div></div><span class="pill">CONFIRMED</span></div>`).join('')}</div>${S.me?nav('explorer'):'<button class="btn" onclick="go(\'landing\')">‹ BACK</button>'}`,
ons:()=>(S.me?hdr('ONS'):back('landing'))+`<h1 style="font-size:26px">OBSIDIAN NAME SERVICE</h1><p class="mu" style="line-height:1.55">Claim a unique name tied to your wallet.</p>${fld('nm','NAME','text','Search an Obsidian name...')}<button class="btn p" style="margin-top:10px" onclick="onsq()">SEARCH</button><div class="err">${err}</div>${res?res:''}<div class="lb">YOUR NAMES</div><div class="card">${S.names.length?S.names.map(n=>`<div class="row"><b class="m">${n}</b><span class="pill">ACTIVE</span></div>`).join(''):'<div class="row mu">No names yet.</div>'}</div>${S.me?nav('menu'):''}`,
node:()=>(S.me?hdr('NODE'):back('landing'))+`<h1 style="font-size:26px">OBSIDIAN EDGE NODE</h1><div class="card" style="margin-top:16px;padding:18px;display:flex;align-items:center;justify-content:space-between"><div><b style="font-size:20px;color:${S.node?'var(--ok)':'var(--mu)'}">${S.node?'NODE ONLINE':'NODE OFFLINE'}</b><div class="mu" style="font-size:12.5px;margin-top:3px">${S.node?'Synced to the latest block':'Disabled on this device'}</div></div><button onclick="S.node=!S.node;save();render()" aria-label="Toggle node" style="width:52px;height:30px;border-radius:15px;border:0;background:${S.node?'#0B0D10':'#D5D9DF'};position:relative;cursor:pointer"><i style="position:absolute;top:3px;${S.node?'right':'left'}:3px;width:24px;height:24px;border-radius:50%;background:${S.node?'#C8A85A':'#fff'}"></i></button></div><div class="card" style="margin-top:12px"><div class="row"><span>NETWORK</span><b>Obsidian Mainnet</b></div><div class="row"><span>CHAIN ID</span><b class="m">obsidian-1</b></div><div class="row"><span>BLOCK HEIGHT</span><b class="m">${S.node?'#'+ht().toLocaleString():'—'}</b></div><div class="row"><span>PEERS</span><b class="m">${S.node?14:'—'}</b></div><div class="row"><span>RPC</span><b>${S.node?'Enabled':'Disabled'}</b></div><div class="row"><span>P2P</span><b>${S.node?'Connected':'Disconnected'}</b></div><div class="row"><span>MINING</span><b>${S.mine&&S.node?'Active':'Inactive'}</b></div></div><button class="btn ${S.node?'':'p'}" onclick="S.node=!S.node;save();render()">${S.node?'DISABLE NODE':'ENABLE NODE'}</button>${S.me?nav('menu'):''}`,
api:()=>(S.me?hdr('API'):back('landing'))+`<h1 style="font-size:26px">OBSIDIAN DEVELOPER</h1><div class="lb">QUICK START (EXAMPLE)</div><pre class="m" style="background:var(--ob);color:#E3C877;border-radius:18px;padding:18px;font-size:12.5px;overflow:auto;line-height:1.6">curl https://api.example/v1/status\n\n{\n  "network": "obsidian-mainnet",\n  "consensus": "proof-of-time",\n  "height": ${ht()}\n}</pre>${S.me?nav('menu'):''}`,
menu:()=>hdr('MENU')+`<div class="card" style="padding:16px;margin-bottom:6px"><b>${S.me||''}</b><div class="mu m" style="font-size:12px;margin-top:4px">${addr()}</div></div>${[['ons','ONS'],['node','NODE'],['api','API']].map(([k,t])=>`<div class="big" onclick="go('${k}')">${t}<span>›</span></div>`).join('')}<button class="btn" style="color:var(--er);border-color:#E7C9C9;margin-top:24px" onclick="delete S.me;save();go('landing')">SIGN OUT</button>${nav('menu')}`};
function txs(n){return S.tx.length?`<div class="card">${S.tx.slice(0,n).map(t=>`<div class="row"><div><b>${t.t}</b><div class="mu" style="font-size:12px;margin-top:3px">${new Date(t.ts).toLocaleString()}</div></div><b class="m ${t.a>0?'ok':''}">${t.a>0?'+':''}${f5(t.a)}</b></div>`).join('')}</div>`:'<div class="card"><div class="row mu">No transactions yet. Start mining to earn your first OBS.</div></div>'}
function render(){if(['home','mine','wallet','menu'].includes(cur)&&!S.me)cur='signin';$('#app').innerHTML=V[cur]();tick()}
function go(s){cur=s;err='';res='';mo=false;scrollTo(0,0);render()}
function signup(){const e=v('em').toLowerCase(),p=v('pw'),q=$('#p2').value,r=v('rf').toUpperCase();
if(!/^\S+@\S+\.\S+$/.test(e))return er('Enter a valid email.');if($('#pw').value.length<8)return er('Password must be at least 8 characters.');if($('#pw').value!==q)return er('Passwords do not match.');
if(!r)return er('A referral code is required. Obsidian is invite only.');if(!/^OBS-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(r)||!VALID.includes(r))return er('That referral code is not valid.');
if(S.users[e])return er('An account with this email already exists.');S.users[e]={ref:r};S.me=e;save();go('home')}
function signin(){const e=v('em').toLowerCase();/* DEMO: password is not verified; do real auth on a server */if(!S.users[e]||!$('#pw').value)return er('Check your email and password.');S.me=e;save();go('home')}
function er(m){err=m;const x=$('.err');if(x)x.textContent=m}
function startM(){S.mine=Date.now();save();render()}
const SESS=14400,el=()=>Math.min((Date.now()-S.mine)/1000,SESS);
function claim(){if(!S.mine||el()<SESS)return;const a=RATE*4;S.bal+=a;S.tx.unshift({t:'Mining Reward',a,ts:Date.now()});S.mine=Date.now();save();render()}
function tick(){if(!S.mine)return;const e=el();if(e>=SESS&&!$('#cl')&&cur==='mine'){render();return}$('#tm')&&($('#tm').textContent=tm(SESS-e));$('#ea')&&($('#ea').textContent=f5(e/3600*RATE));$('#arc')&&$('#arc').setAttribute('stroke-dasharray',Math.max(6,e/SESS*679)+' 679')}
function send(){const t=v('to'),a=parseFloat($('#am').value);if(!/^obs1\w{8,}$/.test(t)&&!/^[a-z0-9-]{3,24}\.obs$/.test(t))return er('Enter a valid address or .obs name.');if(!(a>0))return er('Enter an amount.');if(a+FEE>S.bal)return er('Insufficient balance.');S.bal-=a+FEE;S.tx.unshift({t:'Sent',a:-a,ts:Date.now()});save();err='';render()}
function onsq(){const n=v('nm').toLowerCase().replace(/\.obs$/,'')+'.obs';if(!/^[a-z0-9-]{3,24}\.obs$/.test(n))return er('Use 3–24 letters, numbers or hyphens.');err='';
const own=S.names.includes(n),tk=TAKEN.includes(n);res=`<div class="card" style="margin-top:12px;padding:16px"><div style="display:flex;justify-content:space-between"><b class="m" style="font-size:17px">${n}</b><span class="pill">${own?'YOURS':tk?'TAKEN':'AVAILABLE'}</span></div>${!own&&!tk?`<div class="row" style="margin-top:8px"><span>PRICE</span><b class="m">${PRICE} OBS</b></div><button class="btn p" onclick="buy('${n}')">GET ${n}</button>`:''}</div>`;render()}
function buy(n){if(!S.me)return go('signin');if(S.bal<PRICE){err='You need '+PRICE+' OBS to claim a name.';return render()}S.bal-=PRICE;S.names.push(n);save();res='';render()}
render();setInterval(tick,1000);setTimeout(()=>{if(cur==='splash')go(S.me?'home':'landing')},2000);
</script></body></html>
