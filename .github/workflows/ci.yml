name: CI

# Every claim this project makes about itself is checked here. A green run means
# the core builds and its tests pass, the interface builds and its tests pass,
# the edge worker and the three-node end-to-end cluster pass, the protocol
# invariants that must never drift are still intact, and the release archives
# can actually be produced from this commit. (Test counts are deliberately not
# written in job names: they went stale every time a test was added. The runs
# themselves report them, and scripts/package-releases.sh records them in the
# release notes.)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  core:
    name: obsidian-core (build, typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: obsidian-core/package-lock.json
      - run: npm ci
        working-directory: obsidian-core
      - run: npm run typecheck
        working-directory: obsidian-core
      - run: npm run build
        working-directory: obsidian-core
      - run: npm test
        working-directory: obsidian-core
      - run: npm audit --audit-level=moderate
        working-directory: obsidian-core

  interface:
    name: obsidian-interface (build, typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # There is no lockfile at the repository root; name them explicitly
          # or setup-node fails with "Dependencies lock file is not found".
          cache-dependency-path: |
            obsidian-core/package-lock.json
            obsidian-interface/package-lock.json
      # The interface build compiles the core first and syncs the browser-safe
      # subset, so core dependencies have to be present.
      - run: npm ci
        working-directory: obsidian-core
      - run: npm ci
        working-directory: obsidian-interface
      # Build first: `typecheck` reads obsidian-interface/web/core, which is
      # generated by build:core. On a clean checkout it does not exist yet.
      - run: npm run build
        working-directory: obsidian-interface
      - run: npm run typecheck
        working-directory: obsidian-interface
      - run: npm test
        working-directory: obsidian-interface
      - run: npm audit --audit-level=moderate
        working-directory: obsidian-interface
      # The Genesis Invitation generator is the key to a fresh deployment: its
      # hash must really belong to its code. Needs the interface built, so it
      # runs here rather than in the scripts job.
      - name: Genesis Invitation generator
        run: node --test tests/scripts/genesis-invite-script.test.mjs

  edge:
    name: cloudflare worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --test cloudflare/test/worker.test.mjs

  scripts:
    name: release and operator scripts
    needs: edge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # These decide whether a release is trustworthy and whether a soak run
      # passed, so they get their own check rather than only running inside the
      # packaging step — a green releases job that swallowed a red script is
      # exactly the failure this job makes impossible.
      - name: Signing and verification behaviour
        run: node --test tests/scripts/release-signing.test.mjs
      - name: Soak verdict rules
        run: node --test tests/scripts/soak-verdict.test.mjs
      # nginx is not installed on the runner, and a config nginx rejects is only found out
      # on the server, while an operator is trying to put HTTPS in front of a node. This
      # parses the shipped files, and the per-network sites the Oracle guide generates from
      # them, against nginx's own directive grammar (it once shipped `http2 on;`, a startup
      # error on the nginx that Ubuntu 22.04 and 24.04 carry).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: nginx files parse under nginx's own directive grammar
        run: pip install crossplane && python3 scripts/check-nginx-conf.py

  cluster:
    name: three-node cluster end to end
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: obsidian-core/package-lock.json
      - run: npm ci
        working-directory: obsidian-core
      - run: npm run build
        working-directory: obsidian-core
      # This suite binds fixed ports 39630-39635; it must not run concurrently
      # with another copy of itself on the same runner.
      - run: node --test tests/e2e/cluster.test.mjs

  networks:
    name: four networks side by side (they must never mix)
    needs: [cluster, interface]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            obsidian-core/package-lock.json
            obsidian-interface/package-lock.json
      - run: npm ci
        working-directory: obsidian-core
      - run: npm ci
        working-directory: obsidian-interface
      - run: npm run build
        working-directory: obsidian-core
      - run: npm run build
        working-directory: obsidian-interface
      # Starts a node and an interface for mainnet, testnet, staging and devnet
      # exactly as the launch guides say, then tries to make them touch: foreign
      # addresses, a mis-wired interface, nodes told each other's peer port.
      # Binds ports 9130-9131, 19130-19131, 29130-29131, 39130-39131, 39150-39161
      # and 9288/19288/29288/39288/39289.
      - run: node --test tests/e2e/networks.test.mjs
      # The interface's own browser code (operations, client, wallet), bundled and run against a real
      # node behind a real interface: ONS registration and renewal, the 90/10 revenue split, the
      # 20,000 OBS validator bond and trusted origins, checked on the chain afterwards. Binds ports
      # 49130-49131 and 49288.
      - run: node --test tests/e2e/ecosystem.test.mjs
      # The one-command-per-network helper the Termux and VPS guides use, run on
      # shifted ports (39330-39488, 19330-19488): its isolation promise is tested too.
      - run: node --test tests/scripts/network-script.test.mjs
      # docs/TERMUX-QUICKSTART.md: the commands in each network's section, pasted as written, in a stand-in for a
      # fresh Termux (its own home and temp directory, only the tools Termux ships), one network at a time.
      - run: node --test tests/scripts/termux-quickstart.test.mjs

  invariants:
    name: protocol invariants and genesis determinism
    needs: interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            obsidian-core/package-lock.json
            obsidian-interface/package-lock.json
      - run: npm ci
        working-directory: obsidian-core
      - run: npm run build
        working-directory: obsidian-core
      # Repository consistency validates the browser copy of the protocol
      # version and documented generated paths too. Build the interface in this
      # same isolated job rather than relying on artifacts from another job.
      - run: npm ci
        working-directory: obsidian-interface
      - run: npm run build
        working-directory: obsidian-interface

      - name: Economic invariants must not drift
        working-directory: obsidian-core
        run: node ../scripts/check-invariants.mjs

      # Versions, identities and the guides must agree with the code that runs: package and
      # lock versions, the genesis ids in the docs against `genesis init`, every environment
      # variable an example sets against the ones the code reads, archive names, and that each
      # network's section of the launch guides mentions no other network's ports.
      - name: The repository agrees with itself
        run: node --test tests/scripts/repo-consistency.test.mjs

      - name: Mainnet genesis is deterministic
        working-directory: obsidian-core
        run: |
          set -euo pipefail
          a=$(node dist/index.js genesis init --network mainnet)
          b=$(node dist/index.js genesis init --network mainnet)
          [ "$a" = "$b" ] || { echo "mainnet genesis is not deterministic"; exit 1; }
          echo "$a"

      - name: A mainnet node starts, and reports an intact supply invariant
        working-directory: obsidian-core
        env:
          OBSIDIAN_KEYSTORE_PASSPHRASE: ci-only-not-a-real-passphrase
        run: |
          set -euo pipefail
          node dist/index.js start --network mainnet --data-dir "$RUNNER_TEMP/mainnet" \
            --rpc-port 18630 --p2p-port 18631 --offline --no-mine &
          pid=$!
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:18630/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:18630/supply | tee /dev/stderr | grep -q '"invariantOk":true'
          curl -sf http://127.0.0.1:18630/supply | grep -q '"maxSupplyObs":"21000000.000000000000000000"'
          # Nothing that was removed may come back.
          curl -sf http://127.0.0.1:18630/audit/compliance > compliance.json
          node -e '
            const a = require("./compliance.json");
            const forbidden = ["wac","legacyGenesisAllocation","signupAllocation","miningKyc",
              "miningWithdrawalRequiresWac","nativeExchange","explorerExposesBalances",
              "browserClockControlsMining","serverStoresPrivateKeys","adminMintPath",
              "proofOfWorkConsensus","blockHeaderNonce","selfReportedNodeMetrics",
              "adminRewardOverride","gasCountedAsPlatformRevenue","nodeIdentityIsIpAddress"];
            const back = forbidden.filter((k) => a[k]?.present !== false);
            if (back.length) { console.error("removed features reappeared:", back); process.exit(1); }
            console.log("all", forbidden.length, "removed features confirmed absent");
          '
          kill $pid

  docker:
    name: docker images build, boot and serve
    needs: invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # A Dockerfile in a repository is not evidence that anything is
      # deployable (§119). These steps build the images, start them, and talk
      # to them. If this job is green, the container recipes work.
      - name: Docker is available on the runner
        run: docker version && docker compose version

      - name: Node image builds, starts, and serves a compliant chain
        run: bash obsidian-core/deployment/docker/verify.sh

      - name: Interface image builds, starts, and serves the sites
        run: bash obsidian-interface/deployment/docker/verify.sh

      # The real deployment shape: a node and an interface as one stack, with
      # the interface reading through the node over the compose network.
      - name: The full stack comes up and the interface reaches the node
        env:
          OBSIDIAN_KEYSTORE_PASSPHRASE: ci-only-not-a-real-passphrase
          OBSIDIAN_NETWORK: devnet
        working-directory: obsidian-core/deployment/docker
        run: |
          set -euo pipefail

          # Mint a Genesis Invitation for this throwaway stack, the same way an
          # operator would, and pass it in through the environment. Without it
          # the stack comes up, serves all nine sites, and refuses every
          # registration with ERR_GENESIS_INVITE_NOT_CONFIGURED — the failure
          # this step exists to catch, because a deployment nobody can claim is
          # not a deployment.
          # Same algorithm as scripts/new-genesis-invite.mjs, inlined because the
          # interface is only built inside the container here. Two things the
          # first version of this snippet got wrong, and which made the whole
          # job fail before it started: scryptSync needs `maxmem` at N=32768
          # (Node refuses with "memory limit exceeded" otherwise, leaving CODE
          # and HASH empty), and the server hashes the NORMALISED code
          # (uppercase, punctuation stripped), so hashing the dashed string
          # produces a hash that can never match.
          read -r CODE HASH < <(node -e '
            const { randomBytes, scryptSync } = require("node:crypto");
            const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            const group = () => Array.from(randomBytes(4), (b) => ALPHABET[b % 32]).join("");
            const code = `OBS-GENESIS-${group()}-${group()}-${group()}-${group()}`;
            const salt = randomBytes(16);
            const canonical = code.toUpperCase().replace(/[^A-Z0-9]/g, "");
            const derived = scryptSync(canonical, salt, 32, { N: 32768, r: 8, p: 1, maxmem: 128 * 1024 * 1024 }).toString("hex");
            console.log(code, `scrypt$32768$8$1$${salt.toString("hex")}$${derived}`);
          ')
          [ -n "${CODE:-}" ] && [ -n "${HASH:-}" ] || { echo "could not mint a genesis invitation"; exit 1; }
          echo "minted a genesis invitation for this run"
          export OBSIDIAN_GENESIS_INVITE_HASH="$HASH"

          docker compose up -d --build
          echo "waiting for the interface to become healthy"
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8788/api/health >/dev/null 2>&1; then
              echo "interface healthy after ${i}s"; break
            fi
            sleep 1
            [ "$i" = 90 ] && { docker compose ps; docker compose logs; exit 1; }
          done

          # Every site the build generates must be served by the container.
          for p in / /mine/ /wallet/ /explorer/ /ons/ /node/ /developer/ /app/ /audit/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8788$p")
            printf '%-14s %s\n' "$p" "$code"
            [ "$code" = "200" ] || { echo "site $p did not return 200"; docker compose logs; exit 1; }
          done

          # The first account must actually be registrable with that invitation, and it
          # must be the genesis one: the stack reports itself bootstrapped only
          # if the invitation matched.
          curl -fsS http://127.0.0.1:8788/api/auth/config | grep -q '"configured":true'
          curl -fsS -X POST http://127.0.0.1:8788/api/auth/register \
            -H 'content-type: application/json' \
            -d "{\"email\":\"launch-check@gmail.com\",\"password\":\"ci-only-passphrase-9\",\"inviteCode\":\"$CODE\"}" \
            > register.json
          node -e '
            const r = require("./register.json");
            if (!r.account) { console.error("registration failed:", JSON.stringify(r)); process.exit(1); }
            if (r.bootstrapped !== true) { console.error("the first account did not bootstrap the interface:", JSON.stringify(r)); process.exit(1); }
            console.log("first account registered:", r.account.accountId);
          '

          #
          curl -fsS 'http://127.0.0.1:8788/api/rpc?path=/status' | grep -q '"genesisId"'
          curl -fsS 'http://127.0.0.1:8788/api/rpc?path=/pot' | grep -q 'PROOF_OF_TIME'
          curl -fsS 'http://127.0.0.1:8788/api/rpc?path=/supply' | grep -q '"invariantOk":true'

          # The chain must actually be advancing inside the container.
          h1=$(curl -fsS 'http://127.0.0.1:8788/api/rpc?path=/status' | grep -o '"height":[0-9]*' | head -1 | cut -d: -f2)
          sleep 15
          h2=$(curl -fsS 'http://127.0.0.1:8788/api/rpc?path=/status' | grep -o '"height":[0-9]*' | head -1 | cut -d: -f2)
          echo "height $h1 -> $h2"
          [ "$h2" -gt "$h1" ] || { echo "the containerised chain is not producing blocks"; docker compose logs; exit 1; }

          # The invitation is single-use: the same code must be dead now.
          second=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8788/api/auth/register \
            -H 'content-type: application/json' \
            -d "{\"email\":\"second-check@gmail.com\",\"password\":\"ci-only-passphrase-9\",\"inviteCode\":\"$CODE\"}")
          echo "second registration attempt with the same invitation: HTTP $second"
          [ "$second" != "200" ] || { echo "the genesis invitation was redeemable twice"; docker compose logs; exit 1; }

          # Stopping the interface must not stop consensus.
          docker compose stop interface
          sleep 8
          docker compose exec -T node node -e "fetch('http://127.0.0.1:8630/status').then(r=>r.json()).then(s=>{console.log('node height without the interface:',s.height);process.exit(0)}).catch(()=>process.exit(1))"

          docker compose down -v

  releases:
    name: release archives build from this commit
    # Keep at most three hosted jobs competing for runners at once, and never
    # publish candidate archives unless every independent gate has succeeded.
    needs: [scripts, networks, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            obsidian-core/package-lock.json
            obsidian-interface/package-lock.json
      - run: npm ci
        working-directory: obsidian-core
      - run: npm ci
        working-directory: obsidian-interface
      # --allow-dirty: the archives committed in the tree are rebuilt here, and
      # rebuilt archives differ byte for byte (timestamps), which is expected.
      # What is being proved is that packaging succeeds and the sums verify.
      #
      # --skip-e2e: the three-node cluster suite is already gated by its own
      # job above. Running it a second time inside packaging doubles the
      # runtime of this job for no additional coverage, and a timing-sensitive
      # suite that starts six real nodes is the wrong thing to make the
      # packaging step depend on.
      - name: Package the release archives
        env:
          # The script keeps every gate's log when this is set. Without it the
          # logs live in a mktemp directory that is deleted on exit, so a red
          # release job carries no evidence of why it failed.
          RELEASE_LOG_DIR: ${{ runner.temp }}/release-logs
        run: ./scripts/package-releases.sh --allow-dirty --skip-e2e

      # Publish the gate logs as annotations: they show up on the run page next
      # to the failed step, and are readable through the check-run API, which is
      # the only route available when the log archive itself cannot be fetched.
      - name: Release gate logs (on failure)
        if: failure()
        run: |
          set -euo pipefail
          for log in "$RUNNER_TEMP"/release-logs/*.log; do
            [ -f "$log" ] || continue
            body="$(tail -c 3000 "$log" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=$(basename "$log")::$body"
          done

      - run: cd releases && sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: release-gate-logs
          path: ${{ runner.temp }}/release-logs
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: obsidian-release-archives
          path: |
            releases/*.zip
            releases/*.tar.gz
            releases/SHA256SUMS
            releases/MANIFEST.json
          retention-days: 14
