name: Android

# Builds OBSIDIAN.apk — the native Android client in obsidian-mobile/.
#
# This is the only place in the project where an APK is produced, and it is
# produced from a real Android SDK on a real toolchain. Nothing about the
# blockchain jobs in ci.yml changes when this file runs: the two workflows do not
# share a job, a cache key or a build directory, and this one is filtered to the
# Android tree so an unrelated core commit does not spend an hour on Gradle.
#
# Two artefacts come out, and they are labelled differently on purpose:
#   OBSIDIAN-debug.apk     installable, signed with the throwaway debug key.
#                          This is what a tester installs.
#   OBSIDIAN-release.apk   minified, and UNSIGNED unless the operator supplied a
#                          keystore through repository secrets. An unsigned
#                          release build is not a claim that the app is signed;
#                          publishing a debug key as a production signature would
#                          be exactly the fake signature this project refuses to
#                          invent anywhere else.

on:
  push:
    branches: ['**']
    paths:
      - 'obsidian-mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'obsidian-mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.7'

jobs:
  build:
    name: Obsidian Mobile (build, unit tests, lint, APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # No android-actions/setup-android step: the ubuntu-latest image already
      # ships the SDK with ANDROID_HOME set, and a second installer fighting the
      # preinstalled one is a failure mode this workflow does not need. This step
      # proves the SDK is where the build expects it before anything spends time
      # on Gradle.
      - name: Verify the preinstalled Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is not set on this runner"; exit 1; }
          ls "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install the SDK packages the build names
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Named explicitly rather than trusting whatever the runner image
          # happens to carry: a silent platform bump would otherwise change the
          # compileSdk the APK was built against.
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate the wrapper for this run
        # The wrapper JAR is a binary and is not committed from a machine that
        # cannot download it; CI materialises it so the build uses a pinned
        # Gradle version rather than the runner's.
        run: gradle wrapper --gradle-version "${GRADLE_VERSION}" --no-daemon

      # Every Gradle step pipes through the same reporter. A Kotlin compile
      # error or an unresolvable dependency is echoed back as a check-run
      # annotation, so the diagnosis is readable from the run summary itself
      # rather than only from the raw log. Without this, a failure here says
      # "exit code 1" and nothing else.
      - name: Install the failure reporter
        run: |
          cat > /tmp/report.sh <<'SCRIPT'
          #!/usr/bin/env bash
          # Echo the parts of a Gradle log that actually explain a failure, as
          # check-run annotations. The task-progress lines are noise; what matters
          # is the compiler's own `e:` lines and Gradle's "What went wrong" block.
          log="$1"; title="$2"
          {
            grep -E "^e: " "$log" | head -50
            sed -n '/What went wrong/,/^\* Try/p' "$log" | head -50
            grep -E "Could not resolve|Could not find|Unresolved reference|There were failing tests" "$log" | head -25
          } | while IFS= read -r line; do
            [ -n "$line" ] && printf '::error title=%s::%s\n' "$title" "$line"
          done
          SCRIPT
          chmod +x /tmp/report.sh

      - name: Unit tests
        run: |
          set -o pipefail
          status=0
          # Guarded with ||: the shell runs with -e, so a bare failing pipeline
          # would abort before the error lines could be reported.
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee unit-tests.log || status=$?
          if [ "$status" -ne 0 ]; then
            /tmp/report.sh unit-tests.log Kotlin
            exit "$status"
          fi

      - name: Lint
        run: |
          set -o pipefail
          status=0
          # Guarded with ||: the shell runs with -e, so a bare failing pipeline
          # would abort before the error lines could be reported.
          ./gradlew lintDebug --no-daemon 2>&1 | tee lint.log || status=$?
          if [ "$status" -ne 0 ]; then
            /tmp/report.sh lint.log Lint
            exit "$status"
          fi

      - name: Assemble debug and release
        run: |
          set -o pipefail
          status=0
          # Guarded with ||: the shell runs with -e, so a bare failing pipeline
          # would abort before the error lines could be reported.
          ./gradlew assembleDebug assembleRelease --no-daemon 2>&1 | tee assemble.log || status=$?
          if [ "$status" -ne 0 ]; then
            /tmp/report.sh assemble.log Build
            exit "$status"
          fi
        env:
          # Present only when the operator configured release signing secrets.
          OBSIDIAN_KEYSTORE: ${{ secrets.OBSIDIAN_KEYSTORE_PATH }}
          OBSIDIAN_KEYSTORE_PASSWORD: ${{ secrets.OBSIDIAN_KEYSTORE_PASSWORD }}
          OBSIDIAN_KEY_ALIAS: ${{ secrets.OBSIDIAN_KEY_ALIAS }}
          OBSIDIAN_KEY_PASSWORD: ${{ secrets.OBSIDIAN_KEY_PASSWORD }}

      - name: Collect the artefacts
        run: |
          mkdir -p ../artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../artifacts/OBSIDIAN-debug.apk
          # A release build without a keystore is emitted unsigned; take
          # whichever exists so the artefact list is honest about it.
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ../artifacts/OBSIDIAN-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk ../artifacts/OBSIDIAN-release-unsigned.apk
          fi
          (cd ../artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # The sandbox that drives this build cannot reach Actions' artefact storage,
      # so the facts that matter about the package are printed here as notice
      # annotations, where they can actually be read back: identity, permissions,
      # launch entry point and signing status. This is also the evidence behind
      # the permission summary — it comes from the built package, not from the
      # manifest's intent.
      # The sandbox driving this build cannot reach Actions' artefact storage, so
      # the facts that matter about the package are printed here as notice
      # annotations, where they can be read back: identity, signing status, the
      # permissions baked into the package, and the launch entry point. This is
      # the evidence behind the permission summary — taken from the built package
      # rather than from what the manifest intended.
      #
      # Ordering matters: annotations emitted late in a step have been observed
      # not to surface, so the load-bearing facts come first and the cosmetic
      # listing last.
      - name: Inspect the built APK
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK=$(ls -1 app/build/outputs/apk/debug/*.apk | head -1)
          echo "::notice title=APK file::$(basename "$APK") $(stat -c%s "$APK") bytes"
          echo "::notice title=APK sha256::$(sha256sum "$APK" | cut -d' ' -f1)"

          # Debug builds are signed with the Android debug key; the release variant
          # is unsigned unless the operator supplied a keystore. Report the raw
          # verdict and its exit code rather than a filtered summary that could
          # silently vanish and look like a pass.
          set +e
          "$BT/apksigner" verify --print-certs "$APK" > signer.txt 2>&1
          RC=$?
          set -e
          echo "::notice title=APK signing exit $RC::$(head -3 signer.txt | tr '\n' ' ~ ')"

          RELEASE=$(ls -1 app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          if [ -n "${RELEASE:-}" ]; then
            set +e; "$BT/apksigner" verify "$RELEASE" > rel.txt 2>&1; RRC=$?; set -e
            if [ "$RRC" -eq 0 ]; then
              echo "::notice title=Release APK::signed"
            else
              echo "::notice title=Release APK::UNSIGNED (apksigner exit $RRC). Install the debug APK, or set the OBSIDIAN_KEYSTORE secrets to sign the release."
            fi
          else
            echo "::notice title=Release APK::no release APK produced"
          fi

          LAUNCH=$("$BT/aapt2" dump badging "$APK" | grep -i 'launchable' || echo 'NO LAUNCHABLE ACTIVITY FOUND')
          echo "::notice title=APK launch entry::${LAUNCH}"

          "$BT/aapt2" dump badging "$APK" \
            | grep -E "^package:|sdkVersion:|targetSdkVersion:|uses-permission:|application-label:" \
            | while IFS= read -r line; do echo "::notice title=APK badging::${line}"; done

          echo "::notice title=APK top-level entries::$(unzip -l "$APK" 2>/dev/null | awk 'NR>3 && NF>3 {print $4}' | cut -d/ -f1 | sort -u | tr '\n' ' ' || echo 'unzip unavailable')"

      - name: Upload APK artefacts
        uses: actions/upload-artifact@v4
        with:
          name: OBSIDIAN-apk
          path: artifacts/
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            obsidian-mobile/*.log
            obsidian-mobile/app/build/reports/
          if-no-files-found: ignore

      - name: Publish to a GitHub Release on an android-v* tag
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
