# Obsidian Network — a node plus its interface, in one stack.
#
#   cd obsidian-core/deployment/docker
#   OBSIDIAN_KEYSTORE_PASSPHRASE='a-long-passphrase' docker compose up -d
#
# The node owns all state. The interface is a reader: stop it and the chain keeps
# producing blocks; delete the node's volume and the interface will honestly
# report that no node answers.
name: obsidian

services:
  node:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    image: obsidian/core:1.0.0
    restart: unless-stopped
    environment:
      OBSIDIAN_NETWORK: ${OBSIDIAN_NETWORK:-mainnet}
      OBSIDIAN_NODE_NAME: ${OBSIDIAN_NODE_NAME:-docker-node}
      OBSIDIAN_KEYSTORE_PASSPHRASE: ${OBSIDIAN_KEYSTORE_PASSPHRASE:?set OBSIDIAN_KEYSTORE_PASSPHRASE}
      OBSIDIAN_SEEDS: ${OBSIDIAN_SEEDS:-}
      OBSIDIAN_MINE: ${OBSIDIAN_MINE:-true}
      OBSIDIAN_LOG_LEVEL: ${OBSIDIAN_LOG_LEVEL:-info}
    command: ["start", "--mine"]
    volumes:
      - node-data:/data
    ports:
      # RPC stays on the loopback interface of the host unless an operator
      # deliberately publishes it: it is a control surface for the operator, not
      # a public API. Public reads go through the interface below.
      - "${OBSIDIAN_RPC_BIND:-127.0.0.1}:8630:8630"
      - "${OBSIDIAN_P2P_BIND:-0.0.0.0}:8631:8631"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8630/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  interface:
    build:
      context: ../../../obsidian-interface
      dockerfile: deployment/docker/Dockerfile
    image: obsidian/interface:1.0.0
    restart: unless-stopped
    depends_on:
      node:
        condition: service_healthy
    environment:
      OBSIDIAN_NODE_URLS: http://node:8630
      OBSIDIAN_INTERFACE_PORT: 8788
      OBSIDIAN_INTERFACE_DATA_DIR: /data
      OBSIDIAN_GOOGLE_CLIENT_ID: ${OBSIDIAN_GOOGLE_CLIENT_ID:-}
      OBSIDIAN_INTERFACE_TRUST_PROXY: ${OBSIDIAN_INTERFACE_TRUST_PROXY:-false}
    ports:
      - "${OBSIDIAN_INTERFACE_BIND:-0.0.0.0}:8788:8788"
    volumes:
      - interface-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  node-data:
  interface-data:
