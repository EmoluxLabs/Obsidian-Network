# Obsidian Network — a node plus its interface, in one stack.
#
#   cd obsidian-core/deployment/docker
#   OBSIDIAN_NETWORK=devnet OBSIDIAN_KEYSTORE_PASSPHRASE='a-long-passphrase' docker compose up -d
#
# The node owns all state. The interface is a reader: stop it and the chain keeps
# producing blocks; delete the node's volume and the interface will honestly
# report that no node answers.
name: obsidian

services:
  node:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    image: obsidian/core:1.6.0
    restart: unless-stopped
    environment:
      OBSIDIAN_NETWORK: ${OBSIDIAN_NETWORK:?set OBSIDIAN_NETWORK to devnet, testnet, staging or mainnet - there is no default}
      OBSIDIAN_NODE_NAME: ${OBSIDIAN_NODE_NAME:-docker-node}
      # Pinned because each network has different default ports (devnet RPC is
      # 38630). The published ports below assume 8630/8631 whatever the network.
      OBSIDIAN_RPC_PORT: 8630
      OBSIDIAN_P2P_PORT: 8631
      OBSIDIAN_KEYSTORE_PASSPHRASE: ${OBSIDIAN_KEYSTORE_PASSPHRASE:?set OBSIDIAN_KEYSTORE_PASSPHRASE}
      OBSIDIAN_SEED_NODES: ${OBSIDIAN_SEED_NODES:-${OBSIDIAN_SEEDS:-}}
      OBSIDIAN_MINING_ENABLED: ${OBSIDIAN_MINING_ENABLED:-${OBSIDIAN_MINE:-true}}
      OBSIDIAN_LOG_LEVEL: ${OBSIDIAN_LOG_LEVEL:-info}
    # No --mine here: a command-line flag beats the environment, so it would make
    # OBSIDIAN_MINING_ENABLED=false (a follower node) impossible.
    command: ["start"]
    volumes:
      - node-data:/data
    ports:
      # RPC stays on the loopback interface of the host unless an operator
      # deliberately publishes it: it is a control surface for the operator, not
      # a public API. Public reads go through the interface below.
      - "${OBSIDIAN_RPC_BIND:-127.0.0.1}:8630:8630"
      - "${OBSIDIAN_P2P_BIND:-0.0.0.0}:8631:8631"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8630/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  interface:
    build:
      # The interface image is built from the REPOSITORY ROOT, not from
      # obsidian-interface/: its Dockerfile compiles the core first so the
      # browser bundle and the node share the same modules.
      context: ../../..
      dockerfile: obsidian-interface/deployment/docker/Dockerfile
    image: obsidian/interface:1.6.0
    restart: unless-stopped
    depends_on:
      node:
        condition: service_healthy
    environment:
      # The same network as the node next to it, set once.
      OBSIDIAN_INTERFACE_NETWORK: ${OBSIDIAN_NETWORK:?set OBSIDIAN_NETWORK to devnet, testnet, staging or mainnet - there is no default}
      OBSIDIAN_NODE_URLS: http://node:8630
      OBSIDIAN_INTERFACE_PORT: 8788
      OBSIDIAN_INTERFACE_DATA_DIR: /data
      OBSIDIAN_INTERFACE_TRUST_PROXY: ${OBSIDIAN_INTERFACE_TRUST_PROXY:-false}
      # Without this the stack comes up and nobody can register the first
      # account: /api/auth/config answers `genesisInvite.configured: false` and
      # every registration is refused with ERR_GENESIS_INVITE_NOT_CONFIGURED.
      # Generate one for this deployment and pass it in:
      #   node --input-type=module -e "const {newGenesisInvitation}=await import('./obsidian-interface/dist/server/genesis-invite.js');const {code,hash}=newGenesisInvitation();console.log('CODE '+code);console.log('HASH '+hash)"
      #   OBSIDIAN_GENESIS_INVITE_HASH='scrypt$...' OBSIDIAN_KEYSTORE_PASSPHRASE='...' docker compose up -d
      OBSIDIAN_GENESIS_INVITE_HASH: ${OBSIDIAN_GENESIS_INVITE_HASH:-}
    ports:
      - "${OBSIDIAN_INTERFACE_BIND:-0.0.0.0}:8788:8788"
    volumes:
      - interface-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  node-data:
  interface-data:
