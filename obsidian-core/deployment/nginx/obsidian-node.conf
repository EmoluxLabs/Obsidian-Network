# Reverse proxy for a single node's RPC.
#
# Read this before publishing it: a node's RPC is an operator control surface
# (transaction submission, mempool inspection, peer state). The public thing to
# expose is an Obsidian Interface, which proxies an allowlist of read routes and
# never exposes balances on the explorer surface. Expose the raw RPC only if you
# know why.

upstream obsidian_node_rpc {
    server 127.0.0.1:8630;
    keepalive 16;
}

server {
    listen 80;
    server_name node1.example;

    # Terminate TLS in front of this (see the interface config for a full example)
    # before serving anything on a public network.

    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 256k;

    # Health and identity: cheap, public, safe.
    location = /health { proxy_pass http://obsidian_node_rpc; }
    location = /status { proxy_pass http://obsidian_node_rpc; }
    location = /version { proxy_pass http://obsidian_node_rpc; }

    # Read-only chain views a public dashboard may want.
    location ~ ^/(blocks|tx|names|land|capsules|social|mining|supply|params|oracle|validators|network)/? {
        proxy_pass http://obsidian_node_rpc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Transaction submission is rate limited: nodes are not free faucets.
    location = /tx/submit {
        limit_req zone=obsidian_tx burst=10 nodelay;
        proxy_pass http://obsidian_node_rpc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Everything else — mempool internals, peer administration, arbitrary RPC —
    # stays on the loopback interface where the operator can reach it.
    location / { return 403; }
}

# Put this in the http {} block:
#   limit_req_zone $binary_remote_addr zone=obsidian_tx:10m rate=30r/m;
