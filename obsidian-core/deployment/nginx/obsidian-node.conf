# Reverse proxy for a single node's RPC.
#
# Read this before publishing it: a node's RPC is an operator control surface
# (transaction submission, mempool inspection, peer state). The public thing to
# expose is an Obsidian Interface, which proxies an allowlist of read routes and
# never exposes balances on the explorer surface. Expose the raw RPC only if you
# know why.
#
# Start the node with OBSIDIAN_RPC_TRUST_PROXY=true behind this file, so its own
# rate limiter tells visitors apart (it uses the LAST X-Forwarded-For entry,
# which is the single value written below). Without it every visitor is
# 127.0.0.1 and one abuser uses up everybody's budget.
#
# Add this to the http {} block first:
#   limit_req_zone $binary_remote_addr zone=obsidian_tx:10m   rate=30r/m;
#   limit_req_zone $binary_remote_addr zone=obsidian_read:10m rate=300r/m;

upstream obsidian_node_rpc {
    server 127.0.0.1:8630;     # mainnet. testnet 18630, staging 28630, devnet 38630.
    keepalive 16;
}

server {
    listen 80;
    server_name node1.example;

    # Terminate TLS in front of this (see the interface config for a full example)
    # before serving anything on a public network.

    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 256k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # OVERWRITES, rather than appends: one value, the address nginx saw.
    proxy_set_header X-Forwarded-For $remote_addr;

    # Health and identity: cheap, public, safe.
    location = /health  { limit_except GET HEAD { deny all; } proxy_pass http://obsidian_node_rpc; }
    location = /status  { limit_except GET HEAD { deny all; } proxy_pass http://obsidian_node_rpc; }
    location = /version { limit_except GET HEAD { deny all; } proxy_pass http://obsidian_node_rpc; }

    # Transaction submission — the ONE write a public node accepts, and rate
    # limited: nodes are not free faucets. /tx/simulate, /tx/encode and /tx/gas
    # are not offered here: simulation copies the whole chain state per call.
    location = /tx/submit {
        limit_except POST { deny all; }
        limit_req zone=obsidian_tx burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://obsidian_node_rpc;
    }

    # Read-only chain views a public dashboard may want. Anchored: the group must
    # be followed by "/" or the end of the path (an unanchored match also let
    # "/txfoo" and "/blocksXYZ" through), and ONLY reads are allowed.
    location ~ ^/(blocks|names|mining|supply|params|oracle|validators|network|pot|revenue|nodes)(/|$) {
        limit_except GET HEAD { deny all; }
        limit_req zone=obsidian_read burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://obsidian_node_rpc;
    }
    location ~ ^/(block|tx)/[A-Za-z0-9]+$ {
        limit_except GET HEAD { deny all; }
        limit_req zone=obsidian_read burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://obsidian_node_rpc;
    }

    # Everything else — mempool internals, peers, /metrics, /rpc, /wallet/*,
    # /address/*, simulation — stays on the loopback interface where the operator
    # can reach it.
    location / { return 403; }
}
